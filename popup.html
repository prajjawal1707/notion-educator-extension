<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body {
        width: 260px;
        padding: 0;
        margin: 0;
        font-family: 'Segoe UI', sans-serif;
        background: #fff;
    }

    .header {
        background: #111;
        color: #fff;
        padding: 20px;
        text-align: center;
    }

    h3 {
        margin: 0;
        font-size: 18px;
    }

    .site-name {
        color: #007bff;
        font-weight: bold;
        margin-top: 5px;
        font-size: 14px;
    }

    .content {
        padding: 15px;
    }

    .btn {
        width: 100%;
        padding: 12px;
        margin-bottom: 10px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        font-size: 14px;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
    }

    .btn-primary {
        background: #007bff;
        color: #fff;
        box-shadow: 0 4px 10px rgba(0, 123, 255, 0.3);
    }

    .btn-primary:hover {
        background: #0056b3;
        transform: translateY(-1px);
    }

    .btn-secondary {
        background: #f0f0f0;
        color: #333;
    }

    .btn-secondary:hover {
        background: #e0e0e0;
    }
</style>


<body>
    <div class="header">
        <h3>Web Pilot 🚀</h3>
        <div id="siteName" class="site-name">Detecting Site...</div>
    </div>
    <div class="content">
        <button id="startTour" class="btn btn-primary">
            <span>▶</span> Analyze & Guide Me
        </button>
        <button id="openChat" class="btn btn-secondary">
            <span>💬</span> Ask Assistant
        </button>
    </div>
    <script src="popup.js"></script>
</body>

</html>
